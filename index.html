<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SCORM Player & Debugger</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/src/style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="app">
      <header class="app-header">
        <div class="logo">
          <h1>SCORM Player <span>Debugger</span></h1>
        </div>
        <div class="url-input-container">
          <input type="url" id="course-url" placeholder="Enter SCORM course URL (e.g. http://localhost:8080/index.html)" />
          <button id="load-btn">Load URL</button>
          <span class="divider">or</span>
          <input type="file" id="course-file" accept=".zip" style="display: none;" />
          <button id="upload-btn" class="upload-btn">Upload Local ZIP</button>
        </div>
      </header>
      
      <main class="app-main">
        <section class="player-pane">
          <div class="iframe-container">
            <iframe id="course-iframe" sandbox="allow-scripts allow-same-origin allow-forms allow-popups" title="SCORM Content"></iframe>
            <div id="iframe-placeholder" class="placeholder">
              <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>
              <p>Enter a URL to load the SCORM course.</p>
              <span class="note">Note: If you want to capture iframe console logs/errors, the course must be served on the same origin or configure CORS.</span>
            </div>
          </div>
        </section>

        <aside class="debugger-pane">
          <div class="debugger-header">
            <h2>Debugger Logs</h2>
            <div class="debugger-actions">
              <button id="clear-logs-btn" class="icon-btn" title="Clear Logs">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
              </button>
            </div>
          </div>
          <div class="filter-bar">
            <button class="filter-pill active" data-filter="all">All <span class="count" id="count-all">0</span></button>
            <button class="filter-pill" data-filter="scorm">SCORM <span class="count" id="count-scorm">0</span></button>
            <button class="filter-pill" data-filter="info">Info <span class="count" id="count-info">0</span></button>
            <button class="filter-pill" data-filter="warn">Warn <span class="count" id="count-warn">0</span></button>
            <button class="filter-pill" data-filter="error">Error <span class="count" id="count-error">0</span></button>
          </div>
          <div class="logs-container" id="logs-container">
            <!-- Logs will be appended here -->
          </div>
        </aside>
      </main>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
